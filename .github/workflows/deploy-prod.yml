name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'jackybrave7/rehearsals'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: deploy/remote-deploy.sh
          target: /tmp/
          strip_components: 1

      - name: Run deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -eo pipefail
            DEPLOY_SCRIPT=/tmp/remote-deploy.sh
            if [ ! -f "$DEPLOY_SCRIPT" ]; then
              DEPLOY_SCRIPT=/tmp/deploy/remote-deploy.sh
            fi
            if [ ! -f "$DEPLOY_SCRIPT" ]; then
              echo "Deploy script not found (checked /tmp/remote-deploy.sh and /tmp/deploy/remote-deploy.sh)"
              ls -la /tmp /tmp/deploy 2>/dev/null || true
              exit 1
            fi
            tr -d '\r' < "$DEPLOY_SCRIPT" | bash -s
            echo "Deployed commit on server:"
            git -C /var/www/rehearsals rev-parse --short HEAD
            curl -sf http://127.0.0.1:3001/api/health
